
name: Generate Trophy

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout da MAIN
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. Informações do repositório
      # ============================================================
      - name: Verificar ambiente
        run: |
          echo "=========================================="
          echo "GitHub Trophy Generator"
          echo "=========================================="

          echo "Repository:"
          echo "${{ github.repository }}"

          echo ""
          echo "Branch:"
          git branch --show-current

          echo ""
          echo "Commit:"
          git log -1 --oneline

      # ============================================================
      # 3. Testar acesso REST com GITHUB_TOKEN
      # ============================================================
      - name: Testar GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Testando acesso ao repositório..."

          curl -f \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ThiaggoSylva/ThiaggoSylva

          echo ""
          echo "GITHUB_TOKEN possui acesso ao repositório."

      # ============================================================
      # 4. Testar especificamente o GraphQL
      # ============================================================
      - name: Testar GraphQL com TROPHY_TOKEN
        env:
          TROPHY_TOKEN: ${{ secrets.TROPHY_TOKEN }}
        run: |
          echo "Testando GitHub GraphQL..."

          RESPONSE=$(curl -s \
            -X POST \
            -H "Authorization: Bearer $TROPHY_TOKEN" \
            -H "Content-Type: application/json" \
            https://api.github.com/graphql \
            -d '{"query":"query { user(login: \"ThiaggoSylva\") { login createdAt followers(first: 1) { totalCount } } }"}')

          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q '"errors"'; then
            echo ""
            echo "ERRO: GitHub GraphQL recusou a consulta."
            exit 1
          fi

          if ! echo "$RESPONSE" | grep -q '"login":"ThiaggoSylva"'; then
            echo ""
            echo "ERRO: GraphQL não retornou o usuário ThiaggoSylva."
            exit 1
          fi

          echo ""
          echo "GraphQL funcionando corretamente."

      # ============================================================
      # 5. Gerar Trophy
      # ============================================================
      - name: Generate trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        env:
          GITHUB_TOKEN1: ${{ secrets.TROPHY_TOKEN }}
          GITHUB_TOKEN2: ${{ secrets.TROPHY_TOKEN }}
        with:
          username: ThiaggoSylva
          token: ${{ secrets.TROPHY_TOKEN }}
          file: ./trophy.svg
          theme: default
          max-cols: 6
          max-rows: 2
          panel-size: 115
          margin-width: 10
          margin-height: 10

      # ============================================================
      # 6. Verificar trophy.svg
      # ============================================================
      - name: Verify trophy
        run: |
          echo "=========================================="
          echo "Verificando trophy.svg"
          echo "=========================================="

          if [ ! -f trophy.svg ]; then
            echo "ERRO: trophy.svg não foi criado."
            exit 1
          fi

          if [ ! -s trophy.svg ]; then
            echo "ERRO: trophy.svg está vazio."
            exit 1
          fi

          echo ""
          echo "trophy.svg criado com sucesso."

          echo ""
          echo "Tamanho:"
          ls -lh trophy.svg

          echo ""
          echo "Primeiras linhas:"
          head -n 5 trophy.svg

      # ============================================================
      # 7. Configurar Git
      # ============================================================
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ============================================================
      # 8. Adicionar arquivo
      # ============================================================
      - name: Stage trophy
        run: |
          git add trophy.svg

          echo "Status:"
          git status --short

      # ============================================================
      # 9. Commit
      # ============================================================
      - name: Commit trophy
        run: |
          if git diff --cached --quiet; then
            echo "Nenhuma alteração no trophy.svg."
            exit 0
          fi

          git commit -m "chore: update GitHub trophy"

      # ============================================================
      # 10. Push para MAIN
      # ============================================================
      - name: Push trophy
        run: |
          git push origin main

          echo ""
          echo "=========================================="
          echo "TROPHY PUBLICADO COM SUCESSO"
          echo "=========================================="

      # ============================================================
      # 11. Verificação final
      # ============================================================
      - name: Final verification
        run: |
          echo "Arquivo: trophy.svg"
          echo "Branch: main"
          echo "Repository: ThiaggoSylva/ThiaggoSylva"
          echo ""
          echo "URL:"
          echo "https://github.com/ThiaggoSylva/ThiaggoSylva/blob/main/trophy.svg"

